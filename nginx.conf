server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No cachear el "arranque" de la app ni el service worker (no llevan hash).
    location ~* (index\.html|flutter_service_worker\.js|flutter\.js|main\.dart\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA: cualquier ruta desconocida cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo solo para assets realmente versionados (con hash en el nombre).
    location ~* \.(css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
